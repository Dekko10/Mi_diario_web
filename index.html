<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f2">
  <meta name="description" content="Un cuaderno digital personal y privado.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>Mi Diario</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">m.</div>
        <div>
          <div class="brand-name">mi diario</div>
          <div class="brand-caption">un espacio para ti</div>
        </div>
      </div>

      <button class="new-page" id="newPage" type="button"><span class="plus">＋</span>Nueva página</button>

      <section class="search-panel" aria-label="Buscar y filtrar páginas">
        <label class="section-label search-heading" for="tagFilter">BUSCAR Y FILTRAR</label>
        <select id="tagFilter" class="tag-filter" aria-label="Filtrar por etiqueta">
          <option value="">Todas las etiquetas</option>
          <option value="YO">YO</option>
          <option value="OBS">OBS</option>
          <option value="IDEA">IDEA</option>
          <option value="CONSEJO">CONSEJO</option>
          <option value="ANALISI">ANALISI</option>
          <option value="ACCION">ACCION</option>
          <option value="PREGUNTA">PREGUNTA</option>
          <option value="PLAN">PLAN</option>
          <option value="DESCU">DESCU</option>
        </select>
        <div class="search-input-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="searchInput" class="search-input" type="search" placeholder="Buscar una palabra..."
            autocomplete="off" aria-label="Buscar en títulos y contenido">
          <button id="clearSearch" class="clear-search" type="button" aria-label="Limpiar búsqueda"
            title="Limpiar">×</button>
        </div>
        <div id="searchSummary" class="search-summary" aria-live="polite"></div>
      </section>

      <div class="section-label pages-heading">TU CUADERNO</div>
      <div class="page-list" id="pageList" aria-label="Páginas del diario"></div>
      <div class="sidebar-bottom"><span class="status-dot"></span><span id="saveStatus">Tus escritos se guardan
          aquí</span></div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb">Mi cuaderno <span>/</span> <strong id="topPageNumber">Página 1</strong></div>
        <div class="topbar-right">
          <span class="save-indicator" id="saveIndicator">Guardado</span>
          <button class="file-action" id="exportDiary" type="button">Exportar</button>
          <button class="file-action" id="importDiary" type="button">Importar</button>
          <input id="importFile" type="file" accept=".json,application/json" hidden>
          <div class="avatar">T</div>
        </div>
      </header>

      <section class="writing-area">
        <div class="page-meta">
          <div class="eyebrow">TU ESPACIO PERSONAL</div>
          <div class="date" id="pageDate"></div>
        </div>
        <input id="pageTitle" class="page-title" type="text" maxlength="100" placeholder="Un título para este día..."
          aria-label="Título de la página">
        <div id="pageContent" class="page-content is-empty" contenteditable="true" role="textbox" aria-multiline="true"
          data-placeholder="Escribe una etiqueta para comenzar..." spellcheck="true"
          aria-label="Contenido de la página"></div>
        <footer class="page-footer">
          <div class="footer-left"><span id="wordCount">0 palabras</span><button id="deletePage" class="delete-button"
              type="button">Eliminar página</button></div>
          <div class="page-navigation"><button id="prevPage" class="nav-button" type="button"
              aria-label="Página anterior">←</button><span id="pageCounter">1 / 1</span><button id="nextPage"
              class="nav-button" type="button" aria-label="Página siguiente">→</button></div>
        </footer>
      </section>
    </main>

    <aside class="habits-panel">
      <div class="habits-header">
        <div>
          <div class="eyebrow">SEGUIMIENTO PERSONAL</div>
          <h2>Mis hábitos</h2>
        </div>
        <button id="addHabitButton" class="habit-add-button" type="button">+</button>
      </div>

      <form id="habitForm" class="habit-form" hidden>
        <label for="habitName">Nombre del hábito</label>
        <input id="habitName" type="text" maxlength="60" placeholder="Ej. Cepillarme los dientes" required>

        <label for="habitDuration">Duración en días</label>
        <input id="habitDuration" type="number" min="1" max="365" value="30" required>

        <div class="habit-form-actions">
          <button type="button" id="cancelHabit">Cancelar</button>
          <button type="submit">Crear hábito</button>
        </div>
      </form>

      <div id="habitsList" class="habits-list"></div>
    </aside>
  </div>
  <script src="diary-storage.js"></script>
  <script src="renderer.js"></script>
</body>

</html>
